{% extends "emails/base.html" %}
{% block title %}A form was completed{% endblock %}
{% block content %}
  <h1 style="margin:0 0 8px; font-size:22px; font-weight:normal; color:#1B2B4A;">{{ client_name }} completed a form</h1>
  <p style="margin:0 0 18px; font-size:15px; line-height:1.6; color:#4A5568; font-family:Arial, sans-serif;">Hi {{ recipient_name }}, {{ client_name }} has submitted their responses to:</p>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#FAF6EC; border:1px solid rgba(200,169,81,0.3); border-radius:12px; margin-bottom:24px;"><tr><td style="padding:18px 20px; font-family:Arial, sans-serif;"><p style="margin:0; font-size:16px; font-weight:bold; color:#1B2B4A;">{{ title }}</p></td></tr></table>
  <a href="{{ link }}" style="display:inline-block; background:linear-gradient(135deg,#C8A951,#F0D98C); color:#14213D; text-decoration:none; font-weight:bold; font-size:14px; padding:12px 28px; border-radius:999px; font-family:Arial, sans-serif;">View responses</a>
{% endblock %}
